<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Subtle document shape behind the symbol -->
  <rect x="13" y="9" width="22" height="28" rx="3" fill="#ffffff" opacity="0.10"/>

  <!-- < left bracket -->
  <polyline
    points="17,17 11,24 17,31"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sh)"
  />

  <!-- > right bracket -->
  <polyline
    points="31,17 37,24 31,31"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#sh)"
  />

  <!-- / forward slash -->
  <line
    x1="26" y1="16"
    x2="22" y2="32"
    stroke="#ffffff"
    stroke-width="2.4"
    stroke-linecap="round"
    filter="url(#sh)"
  />
</svg>
