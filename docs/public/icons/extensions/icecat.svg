<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0057B8"/>

  <!-- Cat ears (left) -->
  <polygon points="14,30 26,10 38,30" fill="#ffffff" opacity="0.95"/>
  <!-- Cat ears (right) -->
  <polygon points="62,30 74,10 86,30" fill="#ffffff" opacity="0.95"/>

  <!-- Cat head circle -->
  <circle cx="50" cy="56" r="34" fill="#ffffff" opacity="0.95"/>

  <!-- Eyes -->
  <ellipse cx="37" cy="50" rx="6" ry="7" fill="#0057B8"/>
  <ellipse cx="63" cy="50" rx="6" ry="7" fill="#0057B8"/>
  <!-- Eye shine -->
  <circle cx="39" cy="47" r="2" fill="#ffffff"/>
  <circle cx="65" cy="47" r="2" fill="#ffffff"/>

  <!-- Nose -->
  <polygon points="50,59 46,64 54,64" fill="#0057B8"/>

  <!-- Mouth -->
  <path d="M46,64 Q42,70 38,67" stroke="#0057B8" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M54,64 Q58,70 62,67" stroke="#0057B8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Whiskers left -->
  <line x1="12" y1="58" x2="40" y2="61" stroke="#0057B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="12" y1="65" x2="40" y2="65" stroke="#0057B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Whiskers right -->
  <line x1="60" y1="61" x2="88" y2="58" stroke="#0057B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="60" y1="65" x2="88" y2="65" stroke="#0057B8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
