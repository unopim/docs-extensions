<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="mcp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <filter id="mcp-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="48" height="48" rx="12" fill="url(#mcp-bg)"/>

  <!-- Links from the hub out to the three tools -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.75">
    <path d="M20 24 H26 A4 4 0 0 0 30 20 V16.5" fill="none"/>
    <path d="M20 24 H31" fill="none"/>
    <path d="M20 24 H26 A4 4 0 0 1 30 28 V31.5" fill="none"/>
  </g>

  <!-- The PIM: one source on the left -->
  <circle cx="16" cy="24" r="4.6" fill="#ffffff" filter="url(#mcp-sh)"/>

  <!-- The tools it connects to -->
  <g fill="#ffffff">
    <circle cx="33" cy="15" r="3.1"/>
    <circle cx="34" cy="24" r="3.1"/>
    <circle cx="33" cy="33" r="3.1"/>
  </g>
</svg>
