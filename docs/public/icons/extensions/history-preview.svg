<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="hp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="hp-sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Card background -->
  <rect width="48" height="48" rx="12" fill="url(#hp-bg)"/>

  <!-- Clock circle -->
  <circle cx="24" cy="24" r="13" fill="none" stroke="#ffffff" stroke-width="2.4" opacity="0.9" filter="url(#hp-sh)"/>

  <!-- Clock hands -->
  <line x1="24" y1="24" x2="24" y2="14" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="24" y1="24" x2="31" y2="28" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="24" cy="24" r="1.8" fill="#ffffff"/>

  <!-- History arrow (counter-clockwise arc indicator) -->
  <path
    d="M13.5 19 A11.5 11.5 0 0 0 13 24"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    opacity="0.7"
  />
  <polyline
    points="11,18 13.5,19 16,17"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.7"
  />
</svg>
